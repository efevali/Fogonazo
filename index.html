<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- La colección de minijuegos: la página que contiene a la sala y a los juegos. Ver comun/app.js y docs/coleccion.md. -->
<title>Minijuegos</title>
<meta name="description" content="Una colección de minijuegos para el celular, en un living de los 70.">
<meta name="theme-color" content="#120c0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<style>
html, body { margin: 0; height: 100%; background: #120c0a; overflow: hidden; }
.pantalla { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #120c0a; }
#velo { position: fixed; inset: 0; background: #0a0605; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
#velo.on { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="velo" class="on"></div>
<script src="comun/sonido.js"></script>

</body>
