<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bocetos del mahjong como la mesa ratona vista de cerca, al tamaño del teléfono (915 × 412).
     S-19: ?v=a la partida con la tortuga clásica de 144 fichas (prueba de tamaño), ?v=b con un tablero de 88 (la
     pagoda).
     S-20: ?v=entrada el estuche abierto como pantalla de entrada, sobre el fondo del P-006, donde se elige el tablero.
     ?fondo=… pone debajo una imagen pintada (el P-006); en la entrada va siempre.
     Las fichas son las del juego (mahjong/fichas.js).
     El fondo de nogal es un dibujo con código; el definitivo sería un pedido a la IA de imágenes. -->
<title>Bocetos del mahjong en la mesa ratona</title>
<style>
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 700; src: url(../../comun/fuentes/barlow-semi-condensed-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; src: url(../../comun/fuentes/barlow-semi-condensed-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Caveat; font-weight: 600; src: url(../../comun/fuentes/caveat-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: "Mahjong JP"; font-weight: 700; src: url(../../comun/fuentes/noto-serif-jp-mahjong-700.woff2) format('woff2'); }
@font-face { font-family: Fraunces; font-weight: 100 900; src: url(../../comun/fuentes/fraunces-latin-soft-normal.woff2) format('woff2'); }
:root { --walnut: #5a3520; --walnut-deep: #3a2214; --felt: #8e2a2a; --ivory: #f1e7d0; --bone: #e6d8b8; --back: #2f6b4a; --back-deep: #1f4a33;
  --pencil: #3b3a36; --pen: #1d3a94; --label: "Barlow Semi Condensed", "Arial Narrow", sans-serif; }
html, body { margin: 0; width: 915px; height: 412px; overflow: hidden; }
/* the walnut top of the coffee table, seen from above, with the warm light of the arc lamp from the left */
body { position: relative; font-family: var(--label);
  background:
    radial-gradient(ellipse 70% 90% at 18% 10%, rgba(255,214,150,.28), rgba(255,180,100,0) 60%),
    radial-gradient(ellipse 120% 120% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, rgba(255,255,255,.025) 2px 5px, rgba(0,0,0,.04) 5px 11px, rgba(255,255,255,.02) 11px 17px),
    repeating-linear-gradient(90deg, rgba(40,20,8,.18) 0 1px, transparent 1px 73px),
    linear-gradient(90deg, #6b3f24, #5c341d 30%, #6a3e22 55%, #58321b 80%, #64391f); }
#board { position: absolute; left: 186px; top: 8px; width: 614px; height: 396px; }
#board svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* the score pad, written in pencil */
.pad { position: absolute; left: 18px; top: 14px; width: 150px; padding: 10px 12px 12px; box-sizing: border-box; transform: rotate(-1.6deg);
  background: linear-gradient(rgba(170,150,120,.25) 1px, transparent 1px) 0 34px / 100% 24px, #f6f0e0; color: var(--pencil);
  box-shadow: 0 6px 14px rgba(0,0,0,.4); font-family: Caveat, cursive; font-weight: 600; }
.pad::before { content: ''; position: absolute; left: 0; right: 0; top: -6px; height: 12px; background: #b8322a; box-shadow: 0 2px 2px rgba(0,0,0,.25); }
.pad .t { font: 700 13px var(--label); letter-spacing: .18em; color: #7a2a20; margin-top: 4px; }
.pad .clock { font-size: 44px; line-height: 1; margin: 2px 0 2px; color: var(--pen); }
.pad .row { font-size: 21px; line-height: 24px; }
.pad .row b { font-weight: 600; color: var(--pen); }

/* the actions: bone scoring sticks with the word engraved */
.sticks { position: absolute; left: 20px; top: 222px; display: grid; gap: 10px; }
.stick { width: 146px; height: 30px; border-radius: 15px; position: relative; display: grid; place-items: center;
  background: linear-gradient(180deg, #fbf5e6, #e8dcc0 60%, #cfc1a0); box-shadow: 0 3px 0 #9c8a66, 0 5px 8px rgba(0,0,0,.4);
  font: 700 14px var(--label); letter-spacing: .2em; color: #4a3a26; }
.stick::before, .stick::after { content: ''; position: absolute; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: #b8322a; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.stick::before { left: 12px; } .stick::after { right: 12px; }
.stick.k::before, .stick.k::after { background: #1f4a33; }

/* pause and back, as in Fogonazo */
.pause { position: absolute; right: 29px; top: 14px; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4a4540, #1f1c1a);
  box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 0 0 3px #6d675f; }
.pause::before, .pause::after { content: ''; position: absolute; top: 11px; width: 5px; height: 16px; background: #e9e1d3; border-radius: 1px; }
.pause::before { left: 13px; } .pause::after { right: 13px; }
.volver { position: absolute; right: 18px; bottom: 16px; width: 124px; height: 30px; transform: rotate(-1.5deg); }

/* over the painted background (P-006): only the words, placed on the painted pad and sticks */
.pintado .pad { background: none; box-shadow: none; transform: none; left: 16px; top: 22px; width: 156px; height: 186px; padding: 8px 14px; }
.pintado .pad::before { display: none; }
.pintado .sticks { left: 21px; top: 223px; gap: 11px; }
.pintado .stick { width: 145px; height: 29px; background: none; box-shadow: none; color: #5a4630; text-shadow: 0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(60,40,20,.25); }
.pintado .stick::before, .pintado .stick::after { display: none; }
/* S-20: the case, open on the table, as the way in. The lid with red felt holds the cards of the boards; the tray,
   the tiles in their rows. Drawn with code here; the final one would be painted (a piece on magenta, P-007) */
/* it leaves the teapot and «Volver» in view */
.estuche { position: absolute; left: 190px; top: 10px; width: 616px; height: 350px; border-radius: 8px; padding: 10px; box-sizing: border-box;
  display: grid; grid-template-rows: 214px 8px 1fr; background: linear-gradient(160deg, #7a4a2a, #4a2a16 70%, #3a2010);
  box-shadow: 0 16px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15), inset 0 0 0 2px rgba(0,0,0,.25); }
.tapa { border-radius: 4px; padding: 10px 14px 12px; display: grid; grid-template-rows: auto 1fr; gap: 8px;
  background: radial-gradient(ellipse at 35% 25%, #a83a38, #8e2a2a 55%, #6a1d1d); box-shadow: inset 0 2px 10px rgba(0,0,0,.55); }
.tapa h2 { margin: 0; text-align: center; font: 700 15px var(--label); letter-spacing: .5em; color: #e2b867; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
.tarjetas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: start; }
.tarjeta { background: linear-gradient(170deg, #f8f1df, #ece0c4); color: #3a2a1c; border-radius: 3px; padding: 8px 6px 7px; text-align: center;
  display: grid; justify-items: center; gap: 2px; box-shadow: 0 4px 7px rgba(0,0,0,.45); transform: rotate(var(--r)); }
.tarjeta svg { width: 92px; height: 58px; }
.tarjeta b { font: 700 14px var(--label); letter-spacing: .12em; margin-top: 3px; }
.tarjeta small { font: 600 12px var(--label); opacity: .75; }
.tarjeta i { font: 600 18px Caveat, cursive; font-style: normal; color: var(--pen); line-height: 1; }
.tarjeta.ultima { box-shadow: 0 0 0 2px #e2b867, 0 4px 9px rgba(0,0,0,.5); }
.bisagra { background: linear-gradient(90deg, transparent 14%, #c8a35a 14% 21%, transparent 21% 79%, #c8a35a 79% 86%, transparent 86%); }
.bandeja { border-radius: 4px; padding: 10px 14px; background: radial-gradient(ellipse at 50% 30%, #8a2828, #5a1818); box-shadow: inset 0 3px 10px rgba(0,0,0,.6); display: grid; place-items: center; }
.bandeja svg { width: 100%; height: 100%; }
.entrada #board, .entrada .pause, .entrada .stick { visibility: hidden; }
.note { position: absolute; left: 18px; bottom: 10px; width: 150px; box-sizing: border-box; font: 600 12px/1.3 var(--label); color: #f3e6d0; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 3px; }
</style>
</head>
<body>
<script src="../../mahjong/fichas.js"></script>
<div id="board"></div>
<div class="pad">
  <div class="t" id="nombre">TORTUGA</div>
  <div class="clock">12:48</div>
  <div class="row">quedan <b id="pares">72</b> pares</div>
  <div class="row">récord <b>9:12</b></div>
  <div class="row">puntos <b>1.240</b></div>
</div>
<div class="sticks">
  <div class="stick">DESHACER</div>
  <div class="stick k">PISTA</div>
  <div class="stick">BARAJAR</div>
</div>
<div class="pause"></div>
<svg class="volver" viewBox="0 0 132 34"><path d="M2,4 h126 l-4,13 l4,13 h-126 l4,-13 z" fill="#1c1c1c"/><text x="66" y="23" text-anchor="middle" font-family="Barlow Semi Condensed" font-weight="700" font-size="14" letter-spacing="2.2" fill="#f4f1ea">◀ VOLVER</text></svg>
<div class="note" id="note"></div>

<script>
(async () => {
  // the 42 faces, the game's own (mahjong/fichas.js)
  const { FACES } = window.Fichas;

  const LAYOUTS = {
    // the classic turtle: 87 at the base (with the three ends), 36, 16, 4 and 1 on top
    tortuga: { nombre: 'TORTUGA', n: 144, capas: [
      ['.############.', '...########...', '..##########..', '.############.', '.############.', '..##########..', '...########...', '.############.'],
      ['..............', '....######....', '....######....', '....######....', '....######....', '....######....', '....######....', '..............'],
      ['..............', '..............', '.....####.....', '.....####.....', '.....####.....', '.....####.....', '..............', '..............'],
      ['..............', '..............', '..............', '......##......', '......##......', '..............', '..............', '..............']],
      extra: [[0, 7, 0], [26, 7, 0], [28, 7, 0], [13, 7, 4]] },
    // four boards of 80 to 100 for the horizontal phone (examples for the sketch): butterfly 92, fortress 80, bridge 88
    mariposa: { nombre: 'MARIPOSA', n: 92, capas: [
      ['####....####', '#####..#####', '############', '############', '#####..#####', '####....####'],
      ['............', '.###....###.', '.###.##.###.', '.###.##.###.', '.###....###.', '............'],
      ['............', '............', '.....##.....', '.....##.....', '............', '............']] },
    fortaleza: { nombre: 'FORTALEZA', n: 80, capas: [
      Array(6).fill('##########'),
      ['##......##', '##......##', '..........', '..........', '##......##', '##......##'],
      ['#........#', '..........', '..........', '..........', '..........', '#........#']] },
    puente: { nombre: 'PUENTE', n: 88, capas: [
      Array(4).fill('##############'),
      ['..............', '...########...', '...########...', '..............'],
      ['..............', '....######....', '....######....', '..............'],
      ['..............', '......##......', '......##......', '..............']] },
    // a pagoda of 88: 60, 24 and 4
    pagoda: { nombre: 'PAGODA', n: 88, capas: [
      Array(6).fill('##########'),
      ['..........', '..######..', '..######..', '..######..', '..######..', '..........'],
      ['..........', '..........', '....##....', '....##....', '..........', '..........']] },
  };
  const armar = L => { const P = []; L.capas.forEach((f, z) => f.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') P.push({ x: 2 * c, y: 2 * r, z }); }))); (L.extra || []).forEach(([x, y, z]) => P.push({ x, y, z })); return P.sort((p, q) => p.z - q.z || p.y - q.y || p.x - q.x); };

  // a bone tile with a green back: the face in ivory, and the thickness (ivory over green) to the bottom right
  const W = 36, H = 48, SX = 5, SY = 6, D = 4;
  const symbols = FACES.map(f => `<symbol id="f-${f.id}" viewBox="0 0 36 48">${f.svg}</symbol>`).join('');
  // the lower the layer, the more in the shade of the ones above: so the height reads at a glance
  function tile(x, y, id, sel, shade) {
    return `<g transform="translate(${x} ${y})">
      <rect x="${D}" y="${D}" width="${W}" height="${H}" rx="5" fill="var(--back)"/>
      <rect x="${D * .5}" y="${D * .5}" width="${W}" height="${H}" rx="5" fill="var(--bone)"/>
      <rect width="${W}" height="${H}" rx="5" fill="url(#face)" stroke="${sel ? '#e0952c' : 'rgba(80,60,30,.45)'}" stroke-width="${sel ? 2.4 : .8}"/>
      <svg x="2.5" y="3" width="31" height="42" viewBox="0 0 36 48" color="var(--ivory)"><use href="#f-${id}"/></svg>
      ${shade ? `<rect width="${W}" height="${H}" rx="5" fill="rgba(70,40,15,${shade})"/>` : ''}
      ${sel ? `<rect width="${W}" height="${H}" rx="5" fill="rgba(255,190,90,.28)"/>` : ''}</g>`;
  }
  function board(L) {
    const P = armar(L), ids = FACES.flatMap(f => f.key === f.id ? [f.id, f.id, f.id, f.id] : [f.id]);
    for (let i = ids.length - 1; i > 0; i--) { const j = (Math.sin(i * 99.7) * 1e4 % 1 + 1) % 1 * (i + 1) | 0; [ids[i], ids[j]] = [ids[j], ids[i]]; }
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    P.forEach(t => { const x = t.x * W / 2 - t.z * SX, y = t.y * H / 2 - t.z * SY; minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x + W + D); maxY = Math.max(maxY, y + H + D); });
    const bw = maxX - minX, bh = maxY - minY, el = document.getElementById('board'), s = Math.min(el.clientWidth / bw, el.clientHeight / bh);
    const zmax = Math.max(...P.map(t => t.z));
    const body = P.map((t, i) => tile(t.x * W / 2 - t.z * SX - minX, t.y * H / 2 - t.z * SY - minY, ids[i % ids.length], i === P.length - 9, (zmax - t.z) * .07)).join('');
    el.innerHTML = `<svg viewBox="0 0 ${bw} ${bh}" preserveAspectRatio="xMidYMid meet"><defs>${symbols}
      <linearGradient id="face" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#e9dcbd"/></linearGradient>
      <filter id="sh"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity=".45"/></filter></defs>
      <g filter="url(#sh)">${body}</g></svg>`;
    // the real size of a tile on the reference phone (915 CSS px ≈ 14.5 cm)
    const mm = px => (px * 145 / 915).toFixed(1);
    document.getElementById('note').textContent = `${L.n} fichas · cada una de ${Math.round(W * s)} × ${Math.round(H * s)} px, unos ${mm(W * s)} × ${mm(H * s)} mm en el teléfono`;
    document.getElementById('nombre').textContent = L.nombre;
    document.getElementById('pares').textContent = L.n / 2;
    return P;
  }
  // a small silhouette of each board, seen from above
  const mini = (L, ink) => { const P = armar(L); let mx = 0, my = 0; P.forEach(t => { mx = Math.max(mx, t.x + 2); my = Math.max(my, t.y + 2); });
    return `<svg viewBox="-1 -1 ${mx + 2} ${my + 2}" preserveAspectRatio="xMidYMid meet">${P.map(t => `<rect x="${t.x - t.z * .35}" y="${t.y - t.z * .45}" width="1.8" height="1.8" rx=".3" fill="${ink ? ['#c9b48c', '#b39c72', '#9a825a', '#7f6844', '#644f30'][t.z] : ['#efe3c6', '#f6ecd4', '#fff6e2', '#fffaf0', '#fff'][t.z]}" stroke="${ink ? '#3a2a1c' : 'rgba(60,20,10,.5)'}" stroke-width="${ink ? .2 : .15}"/>`).join('')}</svg>`; };
  const v = new URLSearchParams(location.search).get('v') || 'a';
  // ?fondo=…: a painted background (P-006) under the tiles; the pad and the sticks are the painted ones and only
  // their words are drawn. The image covers the phone (915 wide) and loses the same amount above and below.
  const fondo = new URLSearchParams(location.search).get('fondo');
  const pintado = fondo || (v === 'entrada' ? '../../docs/mahjong/arte/P-006_fondo-mesa.jpg' : null);
  if (pintado) document.body.classList.add('pintado'), document.body.style.background = `#4a2a16 url(${pintado}) center / cover no-repeat`;
  board(v === 'b' ? LAYOUTS.pagoda : LAYOUTS.tortuga);

  if (v === 'entrada') {
    document.body.classList.add('entrada'); document.getElementById('note').remove();
    // the pad tells what to do and what was played last
    document.querySelector('.pad').innerHTML = `<div class="t">MAHJONG · ZEN</div><div class="row" style="margin-top:6px">Elegí un tablero</div>
      <div class="row">en el estuche.</div><div class="row" style="margin-top:24px">el último:</div><div class="row"><b>tortuga, 12:48</b></div>`;
    const list = [[LAYOUTS.mariposa, '6:40'], [LAYOUTS.fortaleza, '—'], [LAYOUTS.puente, '8:02'], [LAYOUTS.pagoda, '7:15'], [LAYOUTS.tortuga, '12:48']];
    const rot = [-1.5, 1, -.5, 1.4, -1];
    // the tiles kept in the tray, face up, in two rows
    const ids = FACES.map(f => f.id), row = 20, tw = 36 + 4, th = 48 + 4;
    let tray = ''; for (let r = 0; r < 2; r++) for (let c = 0; c < row; c++) tray += tile(c * 36, r * 56, ids[(r * 131 + c * 37 + c * c * 3) % ids.length], false, 0);
    document.body.insertAdjacentHTML('beforeend', `<div class="estuche">
      <div class="tapa"><h2>MAHJONG</h2>
        <div class="tarjetas">${list.map(([L, r], i) => `<div class="tarjeta${i === 4 ? ' ultima' : ''}" style="--r:${rot[i]}deg">${mini(L, true)}<b>${L.nombre}</b><small>${L.n} fichas</small><i>récord ${r}</i></div>`).join('')}</div></div>
      <div class="bisagra"></div>
      <div class="bandeja"><svg viewBox="-2 -2 ${row * 36 + 8} ${56 + th + 4}" preserveAspectRatio="xMidYMid meet"><defs>${symbols}
        <linearGradient id="face" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#e9dcbd"/></linearGradient></defs>${tray}</svg></div>
    </div>`);
  }

  document.body.dataset.listo = '1';
})();
</script>
</body>
</html>
