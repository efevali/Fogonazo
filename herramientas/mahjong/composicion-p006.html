<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Composición para el pedido de imágenes P-006: el fondo de la partida del mahjong, la mesa ratona de nogal vista
     desde arriba. Formato 16:9 (1600 × 900); el teléfono muestra la franja central de 1600 × 720 (915 × 412).
     Las posiciones salen del boceto S-19 aprobado: anotador y palitos a la izquierda, dados abajo a la izquierda,
     tetera cortada por el borde derecho, el centro vacío para las fichas. Sin textos: lo que se pinta es lo que va.
     ?guias muestra la franja del teléfono y las zonas de la app (para revisar, no para la IA). -->
<title>P-006 · composición</title>
<style>html, body { margin: 0; background: #000; } svg { display: block; }</style>
</head>
<body>
<svg id="c" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script>
// phone coordinates (915 × 412, the band) → image coordinates
const K = 1600 / 915, OY = 90, X = x => x * K, Y = y => OY + y * K, L = v => v * K;
let s = `<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3f24"/><stop offset=".5" stop-color="#5d351e"/><stop offset="1" stop-color="#673c22"/></linearGradient>
  <radialGradient id="lamp" cx=".15" cy=".05" r=".8"><stop offset="0" stop-color="#ffd696" stop-opacity=".35"/><stop offset="1" stop-color="#ffd696" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
  <radialGradient id="pot" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#7a4b30"/><stop offset=".7" stop-color="#4a2a1a"/><stop offset="1" stop-color="#2e190e"/></radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf5e6"/><stop offset=".6" stop-color="#e8dcc0"/><stop offset="1" stop-color="#cfc1a0"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="6" dy="9" stdDeviation="7" flood-opacity=".45"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#wood)"/>`;
// a soft horizontal grain
for (let i = 0; i < 90; i++) { const y = i * 10 + (i * 37 % 7); s += `<path d="M0 ${y} C 400 ${y + (i % 5) - 2}, 1000 ${y + (i % 3) * 2 - 2}, 1600 ${y + (i % 4) - 1}" stroke="${i % 3 ? '#4a2914' : '#7a4a2a'}" stroke-opacity="${.18 + (i % 4) * .05}" stroke-width="${1 + (i % 3)}" fill="none"/>`; }
s += `<rect width="1600" height="900" fill="url(#lamp)"/>`;
// the score pad, blank, slightly turned, with its red binding on top
s += `<g filter="url(#sh)" transform="rotate(-1.6 ${X(93)} ${Y(110)})"><rect x="${X(18)}" y="${Y(14)}" width="${L(150)}" height="${L(194)}" fill="#f6f0e0"/>
  ${Array.from({ length: 7 }, (_, i) => `<line x1="${X(18)}" x2="${X(168)}" y1="${Y(48 + i * 24)}" y2="${Y(48 + i * 24)}" stroke="#c8b898" stroke-width="1.5"/>`).join('')}
  <rect x="${X(18)}" y="${Y(8)}" width="${L(150)}" height="${L(12)}" fill="#b8322a"/></g>`;
// three bone scoring sticks, blank in the middle, a red or green dot near each end
[0, 1, 2].forEach(i => { const x = X(20), y = Y(222 + i * 40), w = L(146), h = L(30), c = i === 1 ? '#1f4a33' : '#b8322a';
  s += `<g filter="url(#sh)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="url(#bone)"/>
    <circle cx="${x + L(16)}" cy="${y + h / 2}" r="${L(4)}" fill="${c}"/><circle cx="${x + w - L(16)}" cy="${y + h / 2}" r="${L(4)}" fill="${c}"/></g>`; });
// two bone dice, bottom left
const dado = (cx, cy, rot, n) => { const d = L(24), pip = { 1: [[0, 0]], 3: [[-1, -1], [0, 0], [1, 1]], 5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]] }[n];
  return `<g filter="url(#sh)" transform="rotate(${rot} ${cx} ${cy})"><rect x="${cx - d / 2}" y="${cy - d / 2}" width="${d}" height="${d}" rx="${L(5)}" fill="url(#bone)"/>
    ${pip.map(([a, b]) => `<circle cx="${cx + a * d * .27}" cy="${cy + b * d * .27}" r="${n === 1 ? L(4) : L(2.4)}" fill="${n === 1 ? '#b8322a' : '#2a1d14'}"/>`).join('')}</g>`; };
s += dado(X(48), Y(378), 12, 1) + dado(X(86), Y(386), -18, 5);
// the brown ceramic teapot, seen from above, cut by the right edge at mid height; the spout points up, out of the tiles' way
const tx = X(915), ty = Y(215), R = L(46);
s += `<g filter="url(#sh)"><path d="M${tx - R * .55} ${ty - R * .75} L${tx - R * .8} ${ty - R * 1.6} L${tx - R * .55} ${ty - R * 1.65} L${tx - R * .2} ${ty - R * .85} Z" fill="#4a2a1a"/>
  <circle cx="${tx}" cy="${ty}" r="${R}" fill="url(#pot)"/>
  <circle cx="${tx}" cy="${ty}" r="${R * .52}" fill="#5a3522" stroke="#2e190e" stroke-width="3"/>
  <circle cx="${tx}" cy="${ty}" r="${R * .16}" fill="#7a4b30" stroke="#2e190e" stroke-width="2"/>
  <ellipse cx="${tx - R * .35}" cy="${ty - R * .4}" rx="${R * .25}" ry="${R * .1}" fill="#fff" opacity=".18" transform="rotate(-30 ${tx - R * .35} ${ty - R * .4})"/></g>`;
s += `<rect width="1600" height="900" fill="url(#vig)"/>`;
// for review only: the phone band and the app's areas (tiles, pause, back)
if (new URLSearchParams(location.search).has('guias')) s += `<g fill="none" stroke="#7fe3ff" stroke-width="3" stroke-dasharray="14 10">
  <rect x="0" y="${OY}" width="1600" height="720"/><rect x="${X(186)}" y="${Y(8)}" width="${L(652)}" height="${L(396)}"/>
  <circle cx="${X(867)}" cy="${Y(33)}" r="${L(19)}"/><rect x="${X(773)}" y="${Y(366)}" width="${L(124)}" height="${L(30)}"/></g>`;
document.getElementById('c').innerHTML = s;
</script>
</body>
</html>
