<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Barlow; font-weight: 600; src: url(../../comun/fuentes/barlow-semi-condensed-latin-600-normal.woff2); }
@font-face { font-family: Barlow; font-weight: 700; src: url(../../comun/fuentes/barlow-semi-condensed-latin-700-normal.woff2); }
@font-face { font-family: Mono; src: url(../../comun/fuentes/ibm-plex-mono-latin-600-normal.woff2); }
html, body { margin: 0; background: #000; }
svg { display: block; }
</style>
</head>
<body>
<svg id="s" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Composition guide for the Fogonazo instrument scene (one-point perspective, camera above the bench).
// ?clean=1 leaves out every label and the screen content (the version for Gemini).
const CLEAN = new URLSearchParams(location.search).get('clean') === '1';
const W = 1600, H = 900, VP = [760, 20];
let o = '';
const add = s => o += s;
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const toVP = (p, t) => lerp(p, VP, t);
const poly = (pts, fill, extra = '') => `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${fill}" ${extra}/>`;
const PH = '#9dffbf';

add(`<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8c7a4"/><stop offset="1" stop-color="#eadbb9"/></linearGradient>
  <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a321a"/><stop offset="1" stop-color="#7a4626"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d4c6"/><stop offset="1" stop-color="#b9b2a1"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f897d"/><stop offset="1" stop-color="#b7b0a2"/></linearGradient>
  <linearGradient id="pert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6a33"/><stop offset="1" stop-color="#b98244"/></linearGradient>
  <radialGradient id="crt" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#16402a"/><stop offset=".75" stop-color="#0d2a1b"/><stop offset="1" stop-color="#06140c"/></radialGradient>
  <radialGradient id="knob" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5a5550"/><stop offset=".6" stop-color="#2a2724"/><stop offset="1" stop-color="#141210"/></radialGradient>
  <radialGradient id="cone" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5b5048"/><stop offset=".3" stop-color="#2c2622"/><stop offset=".85" stop-color="#3b332d"/><stop offset="1" stop-color="#1c1815"/></radialGradient>
  <linearGradient id="coneLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a8" stop-opacity=".55"/><stop offset=".6" stop-color="#ffc070" stop-opacity=".16"/><stop offset="1" stop-color="#ffb060" stop-opacity=".04"/></linearGradient>
  <radialGradient id="lamp" cx=".18" cy=".05" r=".9"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".45"/><stop offset=".5" stop-color="#ffb060" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1a0c04" flood-opacity=".5"/></filter>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`);

// ---------- wall and bench ----------
const BACK = 420;
add(`<rect width="${W}" height="${BACK}" fill="url(#wall)"/>`);
for (let x = 0; x < W; x += 64) add(`<line x1="${x}" y1="0" x2="${x}" y2="${BACK}" stroke="#c9b48c" stroke-width="2"/>`);
add(`<rect x="0" y="${BACK}" width="${W}" height="${H - BACK}" fill="url(#bench)"/>`);
for (let x = -2400; x < 4000; x += 210) { // planks converging to the vanishing point
  const p = [x, H], t = (H - BACK) / (H - VP[1]); const q = lerp(p, VP, t);
  add(`<line x1="${p[0]}" y1="${H}" x2="${q[0].toFixed(1)}" y2="${BACK}" stroke="#3e2210" stroke-width="2" opacity=".6"/>`);
}
add(`<rect x="0" y="${BACK - 6}" width="${W}" height="8" fill="#3b200f"/>`);

// ---------- magazine clipping pinned on the wall (manual) ----------
const mx = 300, my = 96, mw = 250, mh = 300;
add(`<g transform="rotate(-3 ${mx + mw / 2} ${my + mh / 2})" filter="url(#sh)"><rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="#f2efe6"/>
  <rect x="${mx + 18}" y="${my + 18}" width="${mw - 36}" height="34" fill="#9a9690"/>
  <rect x="${mx + 18}" y="${my + 64}" width="${mw - 36}" height="120" fill="#bdb9b1"/><ellipse cx="${mx + 180}" cy="${my + 112}" rx="44" ry="28" fill="#4a4743"/><rect x="${mx + 40}" y="${my + 120}" width="80" height="40" fill="#8a8580" transform="rotate(-12 ${mx + 80} ${my + 140})"/>
  <rect x="${mx + 40}" y="${my + 198}" width="${mw - 80}" height="22" fill="#9a9690"/><rect x="${mx + 60}" y="${my + 226}" width="${mw - 120}" height="22" fill="#9a9690"/>
  ${[0, 1, 2, 3].map(i => `<rect x="${mx + 24}" y="${my + 258 + i * 9}" width="${mw - 48}" height="3" fill="#b5b1a9"/>`).join('')}
  <circle cx="${mx + mw / 2}" cy="${my + 8}" r="7" fill="#c8402c"/></g>`);

// ---------- light: a warm cone from an unseen lamp above ----------
const cone = `<polygon points="560,-20 760,-20 1350,${H} -40,${H}" fill="url(#coneLight)" style="mix-blend-mode:screen"/>`;
// ---------- oscilloscope: front face facing the camera, top face in perspective ----------
const F = { x0: 640, x1: 1500, y0: 214, y1: 690 }, k = .3;
const tl = [F.x0, F.y0], tr = [F.x1, F.y0], btl = toVP(tl, k), btr = toVP(tr, k);
add(`<ellipse cx="${(F.x0 + F.x1) / 2}" cy="${F.y1 + 6}" rx="${(F.x1 - F.x0) / 2 + 30}" ry="22" fill="#1a0c04" opacity=".45"/>`);
add(poly([tl, tr, btr, btl], 'url(#top)'));
// ventilation slots on top
for (let i = 0; i < 12; i++) { const a = lerp(lerp(tl, tr, .14 + i * .06), lerp(btl, btr, .14 + i * .06), .25), b = lerp(lerp(tl, tr, .14 + i * .06), lerp(btl, btr, .14 + i * .06), .75); add(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#5a554c" stroke-width="5" stroke-linecap="round"/>`); }
// folding carry handle on top
add(`<path d="M${lerp(tl, btl, .5)[0] + 60},${lerp(tl, btl, .5)[1]} L${lerp(tl, btl, .5)[0] + 60},${lerp(tl, btl, .5)[1] - 4} L${lerp(tr, btr, .5)[0] - 60},${lerp(tr, btr, .5)[1] - 4}" stroke="#2a2724" stroke-width="10" fill="none" stroke-linejoin="round"/>`);
// case frame and front panel
add(`<rect x="${F.x0}" y="${F.y0}" width="${F.x1 - F.x0}" height="${F.y1 - F.y0}" rx="10" fill="#2a2724"/><rect x="${F.x0 + 14}" y="${F.y0 + 14}" width="${F.x1 - F.x0 - 28}" height="${F.y1 - F.y0 - 28}" rx="5" fill="url(#front)"/>`);
// feet
for (const fx of [F.x0 + 40, F.x1 - 90]) add(`<rect x="${fx}" y="${F.y1 - 4}" width="50" height="16" rx="4" fill="#141210"/>`);
// screen: bezel, CRT
const S = { x: 676, y: 290, w: 480, h: 356 };
add(`<rect x="${S.x - 16}" y="${S.y - 16}" width="${S.w + 32}" height="${S.h + 32}" rx="22" fill="#1b1916"/><rect x="${S.x}" y="${S.y}" width="${S.w}" height="${S.h}" rx="16" fill="url(#crt)"/>`);
if (!CLEAN) {
add(`<g stroke="#3f8f5c" stroke-width="1" opacity=".55">`);
for (let i = 1; i < 10; i++) add(`<line x1="${S.x + i * S.w / 10}" y1="${S.y + 8}" x2="${S.x + i * S.w / 10}" y2="${S.y + S.h - 8}" stroke-dasharray="${i === 5 ? '0' : '2 6'}"/>`);
for (let j = 1; j < 8; j++) add(`<line x1="${S.x + 8}" y1="${S.y + j * S.h / 8}" x2="${S.x + S.w - 8}" y2="${S.y + j * S.h / 8}" stroke-dasharray="${j === 4 ? '0' : '2 6'}"/>`);
add(`</g>`);
}
// control area: power lamp, two selectors, BNC sockets
const C = { x: 1184, y: 270, w: 292, h: 392 };
add(`<rect x="${C.x}" y="${C.y}" width="${C.w}" height="${C.h}" rx="8" fill="#2f2c28"/>`);
add(`<circle cx="${C.x + 30}" cy="${C.y + 26}" r="8" fill="#ff4d3d"/>`);
function knob(cx, cy, r, ang, labels, sel, title) {
  let s = `<ellipse cx="${cx}" cy="${cy + 8}" rx="${r}" ry="${r}" fill="#0c0b0a"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#knob)"/>`;
  for (let i = 0; i < 24; i++) { const b = i / 24 * Math.PI * 2; s += `<line x1="${cx + (r - 4) * Math.cos(b)}" y1="${cy + (r - 4) * Math.sin(b)}" x2="${cx + r * Math.cos(b)}" y2="${cy + r * Math.sin(b)}" stroke="#55504a" stroke-width="2.5"/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="${r * .62}" fill="#33302c"/>`;
  if (!CLEAN) {
    const n = labels.length, a0 = -140, a1 = -40;
    labels.forEach((l, i) => { const a = (a0 + (a1 - a0) * i / (n - 1)) * Math.PI / 180; s += `<text x="${cx + (r + 22) * Math.cos(a)}" y="${cy + (r + 22) * Math.sin(a) + 6}" text-anchor="${Math.cos(a) < -.3 ? 'end' : Math.cos(a) > .3 ? 'start' : 'middle'}" font-family="Barlow" font-weight="700" font-size="15" letter-spacing="1" fill="${i === sel ? '#ffb648' : '#cfc8ba'}">${l}</text>`; });
    s += `<text x="${cx}" y="${cy + r + 34}" text-anchor="middle" font-family="Barlow" font-weight="700" font-size="15" letter-spacing="3" fill="#e9e3d6">${title}</text>`;
    const a = (a0 + (a1 - a0) * sel / (labels.length - 1)) * Math.PI / 180;
    s += `<line x1="${cx}" y1="${cy}" x2="${cx + (r - 8) * Math.cos(a)}" y2="${cy + (r - 8) * Math.sin(a)}" stroke="#f4f1ea" stroke-width="5" stroke-linecap="round"/>`;
  }
  return s;
}
add(knob(C.x + C.w / 2, C.y + 118, 56, 0, ['NIVELES', 'ZEN', 'RÉCORDS'], 0, 'MODO'));
add(knob(C.x + C.w / 2, C.y + 300, 40, 0, ['FÁCIL', 'NORMAL', 'DIFÍCIL'], 1, 'DIFICULTAD'));
for (const bx of [C.x + 36, C.x + C.w - 36]) add(`<circle cx="${bx}" cy="${C.y + C.h - 30}" r="12" fill="#b9b3a7"/><circle cx="${bx}" cy="${C.y + C.h - 30}" r="5" fill="#2a2724"/>`);
if (!CLEAN) {
  add(`<text x="${F.x0 + 40}" y="${F.y0 + 46}" font-family="Barlow" font-weight="700" font-size="22" letter-spacing="7" fill="#2c2924">FOGONAZO</text>`);
  add(`<g filter="url(#glow)" font-family="Mono" fill="${PH}">
    <text x="${S.x + 36}" y="${S.y + 56}" font-size="20" letter-spacing="4" opacity=".8">NIVELES</text>
    <text x="${S.x + 36}" y="${S.y + 150}" font-size="78" letter-spacing="3">NIVEL 12</text>
    <text x="${S.x + 36}" y="${S.y + 300}" font-size="24" letter-spacing="2">★ 27 ESTRELLAS · NORMAL</text>
    <text x="${S.x + 36}" y="${S.y + 345}" font-size="19" letter-spacing="2.5" opacity=".75">TOCÁ PARA JUGAR ▶</text></g>`);
  let d = ''; for (let i = 0; i <= S.w - 20; i += 3) d += (i ? 'L' : 'M') + (S.x + 10 + i) + ',' + (S.y + 215 + 22 * Math.sin(i / 125 * Math.PI * 2)).toFixed(1);
  add(`<path d="${d}" stroke="${PH}" stroke-width="3" fill="none" filter="url(#glow)"/>`);
}

// ---------- pertinax board lying on the bench, with the speaker beside it ----------
const G = (X, Z) => lerp([X, 800], VP, Z / (Z + 1500));         // ground plane: X across, Z away from the camera
const ROT = -11 * Math.PI / 180, GC = [310, 330], GW = 480, GD = 520;  // board centre, width and depth (ground units)
const P = (u, v) => { const lx = (v - .5) * GW, lz = (u - .5) * GD; return G(GC[0] + lx * Math.cos(ROT) - lz * Math.sin(ROT), GC[1] + lx * Math.sin(ROT) + lz * Math.cos(ROT)); };
const F1 = P(0, 0), F2 = P(0, 1), B1 = P(1, 0), B2 = P(1, 1);
// speaker lying face up behind the board, to the left
const sc = [170, 500];
add(`<ellipse cx="${sc[0]}" cy="${sc[1] + 16}" rx="150" ry="62" fill="#1a0c04" opacity=".45"/><ellipse cx="${sc[0]}" cy="${sc[1]}" rx="142" ry="58" fill="#2a2724"/><ellipse cx="${sc[0]}" cy="${sc[1] - 4}" rx="118" ry="46" fill="url(#cone)"/><ellipse cx="${sc[0]}" cy="${sc[1] - 6}" rx="36" ry="14" fill="#b9b3a7"/>`);
// board
add(`<g filter="url(#sh)">${poly([F1, F2, B2, B1], 'url(#pert)')}</g>`);
add(poly([F1, F2, [F2[0], F2[1] + 8], [F1[0], F1[1] + 8]], '#6a4520'));
for (const [u, v] of [[.08, .05], [.08, .95], [.92, .05], [.92, .95]]) { const p = P(u, v); add(`<ellipse cx="${p[0]}" cy="${p[1]}" rx="7" ry="4" fill="#5a3a18"/>`); }
// two channels: a potentiometer at the left end, then ten LEDs along the board
const leds = ['#3dff7a', '#3dff7a', '#3dff7a', '#3dff7a', '#3dff7a', '#3dff7a', '#ffd23f', '#ffd23f', '#ff3a26', '#ff3a26'];
for (const [u, lab, on] of [[.68, 'MÚSICA', 7], [.3, 'EFECTOS', 9]]) {
  const pp = P(u, .12);
  add(`<ellipse cx="${pp[0]}" cy="${pp[1] + 2}" rx="26" ry="11" fill="#7a7468"/><rect x="${pp[0] - 6}" y="${pp[1] - 24}" width="12" height="26" fill="#b9b3a7"/><rect x="${pp[0] - 18}" y="${pp[1] - 44}" width="36" height="22" fill="#2a2724"/><ellipse cx="${pp[0]}" cy="${pp[1] - 22}" rx="18" ry="7" fill="#1c1a18"/><ellipse cx="${pp[0]}" cy="${pp[1] - 44}" rx="18" ry="7" fill="#4a4540"/>`);
  for (let i = 0; i < 10; i++) {
    const q = P(u, .28 + i * .068), lit = !CLEAN && i < on;
    add(`<ellipse cx="${q[0]}" cy="${q[1] - 6}" rx="9" ry="9" fill="${lit ? leds[i] : '#5a2a1a'}" ${lit ? 'filter="url(#glow)"' : ''} opacity="${lit ? 1 : .8}"/><rect x="${q[0] - 9}" y="${q[1] - 6}" width="18" height="8" fill="${lit ? leds[i] : '#4a2214'}" opacity=".8"/>`);
  }
  if (!CLEAN) { const lp = P(u + .12, .28); add(`<text x="${lp[0]}" y="${lp[1]}" font-family="Barlow" font-weight="700" font-size="15" letter-spacing="2" fill="#f4e6c8">${lab}</text>`); }
}
// small parts: chip, capacitors, resistors
const ch = P(.5, .85); add(`<rect x="${ch[0] - 30}" y="${ch[1] - 16}" width="60" height="22" rx="3" fill="#1c1a18"/>`);
for (const [u, v] of [[.85, .8], [.15, .82]]) { const c = P(u, v); add(`<rect x="${c[0] - 10}" y="${c[1] - 34}" width="20" height="34" rx="4" fill="#2f5fb8"/><ellipse cx="${c[0]}" cy="${c[1] - 34}" rx="10" ry="4" fill="#c9ccd1"/>`); }
for (const [u, v] of [[.5, .3], [.5, .55]]) { const c = P(u, v); add(`<rect x="${c[0] - 18}" y="${c[1] - 6}" width="36" height="9" rx="4" fill="#d9a066"/>`); }
// wires to the speaker
const w0 = P(.9, .02), w1 = P(.86, .02);
add(`<path d="M${w0[0]},${w0[1]} C${w0[0] - 20},${w0[1] - 60} ${sc[0] + 60},${sc[1] + 70} ${sc[0] + 90},${sc[1] + 20}" stroke="#c8402c" stroke-width="5" fill="none"/><path d="M${w1[0]},${w1[1]} C${w1[0] - 30},${w1[1] - 50} ${sc[0] + 40},${sc[1] + 80} ${sc[0] + 70},${sc[1] + 30}" stroke="#1c1a18" stroke-width="5" fill="none"/>`);

// ---------- lamp light ----------
add(cone);
add(`<rect width="${W}" height="${H}" fill="#000" opacity=".18" style="mix-blend-mode:multiply"/>`);

// ---------- the phone's crop (20:9) and the back label, only in the annotated version ----------
if (!CLEAN) {
  add(`<rect x="0" y="0" width="${W}" height="90" fill="#000" opacity=".45"/><rect x="0" y="${H - 90}" width="${W}" height="90" fill="#000" opacity=".45"/>`);
  add(`<g transform="rotate(-1.5 110 120)"><path d="M30,104 h160 l-5,16 l5,16 h-160 l5,-16 z" fill="#1c1c1c"/><text x="110" y="128" text-anchor="middle" font-family="Barlow" font-weight="700" font-size="22" letter-spacing="3" fill="#f4f1ea">◀ SALA</text></g>`);
}
document.getElementById('s').innerHTML = o;
document.fonts.ready.then(() => setTimeout(() => document.body.setAttribute('data-ready', '1'), 300));
</script>
</body>
</html>
