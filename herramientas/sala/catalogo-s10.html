<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Sketch S-10, close-up sheet: each special and obstacle on a protoboard cell, about 3.5 times the game size. -->
<style>
@font-face { font-family: Barlow; font-weight: 600; src: url(../../docs/sala/maqueta-fogonazo/fuentes/barlow-semi-condensed-latin-600-normal.woff2); }
@font-face { font-family: Barlow; font-weight: 700; src: url(../../docs/sala/maqueta-fogonazo/fuentes/barlow-semi-condensed-latin-700-normal.woff2); }
html, body { margin: 0; background: #2b1a0e; }
svg { display: block; }
</style>
</head>
<body>
<svg id="s" width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="arte-s10.js"></script>
<script>
const BASE = '../../docs/sala/maqueta-fogonazo/', T = 158, K = T / 45;
// a protoboard cell from the match background, as the tile's backdrop
const cellBg = (x, y, r, c, dy = 0) => `<svg x="${x}" y="${y}" width="${T}" height="${T}" viewBox="0 0 ${T} ${T}"><image href="${BASE}fondo.webp" x="${-(232.5 + c * 45) * K}" y="${-(26 + r * 45 + dy) * K}" width="${915 * K}" height="${412 * K}"/></svg>`;
const ITEMS = [
  // [kind, name, note, piece type]
  [['rayoH', 'Rayo', 'barre la fila', 0], ['rayoV', 'Rayo', 'barre la columna', 4], ['sobre', 'Sobrecarga', 'explota alrededor', 3], ['bateria', 'Batería', 'pila de 9 V, etiqueta de 7 colores', null], ['antena', 'Antena', 'transmite a un blanco', 2]],
  [['pad1', 'Pad de cobre', 'una pasada', 1], ['pad2', 'Pad con remaches', 'dos pasadas', 5], ['padOk', 'Pad soldado', 'estañado', 3], ['quem1', 'Quemado', 'un golpe', null], ['quem2', 'Quemado con carcasa', 'dos golpes (TO-3)', null]],
  [['kapton', 'Cinta kapton', 'se despega con una línea', 2], ['valvula', 'Válvula', 'baja hasta el zócalo', null], ['hueco', 'Hueco', 'sin protoboard: se ve la mesa', null], ['zocalo', 'Zócalo', 'debajo de la fila de abajo', null]],
];
let out = S10.defs + `<rect width="1400" height="1000" fill="#2b1a0e"/>`;
out += `<text x="40" y="52" font-family="Barlow" font-weight="700" font-size="30" letter-spacing="2" fill="#f3e6cc">S-10 · ESPECIALES Y OBSTÁCULOS EN EL ESTILO DEL BANCO</text>`;
out += `<text x="40" y="80" font-family="Barlow" font-weight="600" font-size="18" fill="#d9c7a6">Boceto con código, a unas 3,5 veces el tamaño del juego: guía de composición para el pedido de imágenes. En el juego, rayo, sobrecarga, antena y válvula se animan.</text>`;
const heads = ['ESPECIALES', 'OBSTÁCULOS', ''];
ITEMS.forEach((row, ri) => {
  const y = 140 + ri * 285;
  if (heads[ri]) out += `<text x="40" y="${y - 22}" font-family="Barlow" font-weight="700" font-size="16" letter-spacing="3" fill="#e0a85a">${heads[ri]}</text>`;
  row.forEach(([k, name, note, t], ci) => {
    const x = 70 + ci * 260, w = T;
    out += `<g transform="translate(${x} ${y})"><rect x="-4" y="-4" width="${w + 8}" height="${w + 8}" rx="6" fill="#120a05"/>`;
    if (k === 'zocalo') out += cellBg(0, 0, 7, 4, 18) + `<svg x="0" y="0" width="${w}" height="${w}" viewBox="0 0 45 45" overflow="hidden">${S10.cell('valvula', 0, -18, 45)}${S10.zocalo(-10, 28, 65, 45)}</svg>`;
    else if (k === 'hueco') out += cellBg(0, 0, 3, 3) + `<svg x="0" y="0" width="${w}" height="${w}" viewBox="0 0 45 45">${S10.cell('hueco', 6, 6, 33)}${S10.holeEdges([[0, 0]], 33, 6, 6)}</svg>`;
    else out += cellBg(0, 0, 3, 3) + S10.cell(k, 0, 0, w, t === null ? undefined : t, BASE + 'piezas/');
    out += `<text x="${w / 2}" y="${w + 34}" text-anchor="middle" font-family="Barlow" font-weight="700" font-size="22" fill="#f3e6cc">${name}</text>`;
    out += `<text x="${w / 2}" y="${w + 58}" text-anchor="middle" font-family="Barlow" font-weight="600" font-size="17" fill="#c9b38e">${note}</text></g>`;
  });
});
document.getElementById('s').innerHTML = out;
</script>
</body>
</html>
