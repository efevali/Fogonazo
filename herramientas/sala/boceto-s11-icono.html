<!doctype html>
<meta charset="utf-8">
<title>S-11a · ícono</title>
<!-- Boceto S-11a: the app icon, a crop of the window of the room with someone seen from behind.
     The figure is drawn with code only to fix the framing; the final art would be an image request.
     Open from the repo root through a local server: herramientas/sala/boceto-s11-icono.html?v=a|b&size=512&mask=none|circle -->
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const V = q.get('v') || 'a', SIZE = +(q.get('size') || 512), MASK = q.get('mask') || 'none';
// crops on docs/sala/arte/sala-v2.png (2752 x 1536)
const CROPS = { a: [860, 300, 600], b: [800, 430, 560] };
const img = new Image();
img.src = '../../docs/sala/arte/sala-v2.png';
img.onload = () => {
  const W = img.width, H = img.height;
  const big = document.createElement('canvas'); big.width = W; big.height = H;
  const g = big.getContext('2d');
  g.drawImage(img, 0, 0);
  if (V === 'a') standing(g, 1045, 560, 1.22); else sitting(g, 975, 606, 1.05);
  const [x, y, s] = CROPS[V];
  const c = document.getElementById('c'); c.width = c.height = SIZE;
  const k = c.getContext('2d');
  k.imageSmoothingQuality = 'high';
  // Android shows a maskable icon through a circle that covers the central 80 % of the square
  if (MASK === 'circle') {
    k.beginPath(); k.arc(SIZE / 2, SIZE / 2, SIZE / 2, 0, 7); k.clip();
    k.drawImage(big, x + s * .1, y + s * .1, s * .8, s * .8, 0, 0, SIZE, SIZE);
  } else k.drawImage(big, x, y, s, s, 0, 0, SIZE, SIZE);
  document.title = 'listo';
};

// --- the figure, seen from behind: hair, ears, nape, shoulders in an olive sweater -------------
// Drawn on its own layer and softened a little, so it sits in the painting instead of on top of it.
const HAIR = '#2a1c15', HAIR_HI = '#4a3022', SKIN = '#9a6448', SKIN_SH = '#6e4330';
const SWEATER = '#66733f', SWEATER_SH = '#3d4726', RIM = 'rgba(160,178,235,.6)', WARM = 'rgba(255,196,120,.45)';

function layer(g, draw) {
  const L = document.createElement('canvas'); L.width = g.canvas.width; L.height = g.canvas.height;
  const l = L.getContext('2d'); draw(l);
  g.save(); g.filter = 'blur(1.2px)'; g.drawImage(L, 0, 0); g.restore();
}

function head(g, cx, top, s, tilt) {
  const w = 44 * s, h = 54 * s, cy = top + h;
  g.save(); g.translate(cx, cy); g.rotate(tilt || 0);
  for (const d of [-1, 1]) {
    g.fillStyle = SKIN; g.beginPath(); g.ellipse(d * (w - 5 * s), 8 * s, 8 * s, 14 * s, d * .2, 0, 7); g.fill();
    g.fillStyle = SKIN_SH; g.beginPath(); g.ellipse(d * (w - 7 * s), 10 * s, 3.5 * s, 8 * s, d * .2, 0, 7); g.fill();
  }
  const hg = g.createRadialGradient(w * .35, -h * .55, 2, 0, 0, h * 1.2);
  hg.addColorStop(0, HAIR_HI); hg.addColorStop(.5, HAIR); hg.addColorStop(1, '#170f0a');
  g.fillStyle = hg;
  g.beginPath();
  g.moveTo(-w * .74, h * .66);
  g.bezierCurveTo(-w * 1.1, h * .1, -w * 1.04, -h * 1.05, 0, -h);
  g.bezierCurveTo(w * 1.04, -h * 1.05, w * 1.1, h * .1, w * .74, h * .66);
  g.bezierCurveTo(w * .45, h * .9, -w * .45, h * .9, -w * .74, h * .66);
  g.fill();
  // a few locks at the nape so the hairline is not a hard edge
  g.strokeStyle = '#1d140e'; g.lineWidth = 2 * s;
  for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(i * 9 * s, h * .78); g.lineTo(i * 9 * s + 2 * s, h * .9); g.stroke(); }
  g.strokeStyle = RIM; g.lineWidth = 2.5 * s; g.beginPath(); g.ellipse(0, 0, w * .99, h * .99, 0, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
  g.strokeStyle = WARM; g.lineWidth = 4 * s; g.beginPath(); g.ellipse(0, 0, w * .96, h * .96, 0, Math.PI * 1.9, Math.PI * 2.25); g.stroke();
  g.restore();
  return { neckY: cy + h * .72 };
}

function neck(g, cx, y, s) {
  g.fillStyle = SKIN_SH; g.beginPath();
  g.moveTo(cx - 20 * s, y - 16 * s); g.lineTo(cx + 20 * s, y - 16 * s); g.lineTo(cx + 24 * s, y + 16 * s); g.lineTo(cx - 24 * s, y + 16 * s); g.fill();
}

// torso from behind: trapezius slope, rounded deltoids, arms hanging (or bent forward with elbows out)
function torso(g, cx, y, s, bottom, elbows) {
  const sw = 116 * s;
  const sg = g.createLinearGradient(0, y, 0, y + 260 * s);
  sg.addColorStop(0, SWEATER); sg.addColorStop(1, SWEATER_SH);
  g.fillStyle = sg;
  g.beginPath();
  g.moveTo(cx - 24 * s, y);
  g.bezierCurveTo(cx - 62 * s, y + 10 * s, cx - sw + 18 * s, y + 20 * s, cx - sw + 4 * s, y + 46 * s);
  if (elbows) {
    g.bezierCurveTo(cx - sw - 8 * s, y + 70 * s, cx - sw - 26 * s, elbows - 30 * s, cx - sw - 30 * s, elbows);
    g.lineTo(cx + sw + 30 * s, elbows);
    g.bezierCurveTo(cx + sw + 26 * s, elbows - 30 * s, cx + sw + 8 * s, y + 70 * s, cx + sw - 4 * s, y + 46 * s);
  } else {
    g.bezierCurveTo(cx - sw - 8 * s, y + 80 * s, cx - sw - 6 * s, y + 160 * s, cx - sw - 10 * s, bottom);
    g.lineTo(cx + sw + 10 * s, bottom);
    g.bezierCurveTo(cx + sw + 6 * s, y + 160 * s, cx + sw + 8 * s, y + 80 * s, cx + sw - 4 * s, y + 46 * s);
  }
  g.bezierCurveTo(cx + sw - 18 * s, y + 20 * s, cx + 62 * s, y + 10 * s, cx + 24 * s, y);
  g.closePath(); g.fill();
  // where the arms meet the back, and the collar ribbing
  g.strokeStyle = 'rgba(28,34,16,.45)'; g.lineWidth = 3 * s;
  for (const d of [-1, 1]) { g.beginPath(); g.moveTo(cx + d * (sw - 22 * s), y + 52 * s); g.quadraticCurveTo(cx + d * (sw - 30 * s), y + 120 * s, cx + d * (sw - 24 * s), Math.min(bottom, elbows || 1e9)); g.stroke(); }
  g.strokeStyle = SWEATER_SH; g.lineWidth = 5 * s; g.beginPath();
  g.moveTo(cx - 28 * s, y + 3 * s); g.quadraticCurveTo(cx, y + 15 * s, cx + 28 * s, y + 3 * s); g.stroke();
  g.strokeStyle = RIM; g.lineWidth = 2.5 * s; g.beginPath();
  g.moveTo(cx - 32 * s, y + 3 * s); g.bezierCurveTo(cx - 64 * s, y + 12 * s, cx - sw + 18 * s, y + 22 * s, cx - sw + 5 * s, y + 46 * s); g.stroke();
  g.strokeStyle = WARM; g.lineWidth = 5 * s; g.beginPath();
  g.moveTo(cx + 32 * s, y + 4 * s); g.bezierCurveTo(cx + 64 * s, y + 13 * s, cx + sw - 18 * s, y + 23 * s, cx + sw - 6 * s, y + 46 * s); g.stroke();
}

// A: standing in the room, in front of the sofa, looking out of the window
function standing(g, cx, top, s) {
  layer(g, l => {
    const n = (top + 54 * s) + 54 * s * .72;
    neck(l, cx, n, s);
    torso(l, cx, n + 10 * s, s, 1536);
    head(l, cx, top, s, -.04);
  });
}

// B: kneeling on the sofa, looking out of the window over the backrest (its top is at y = 812)
function sitting(g, cx, top, s) {
  layer(g, l => {
    l.save(); l.beginPath(); l.rect(0, 0, 2752, 813); l.clip();
    const n = (top + 54 * s) + 54 * s * .72;
    neck(l, cx, n, s);
    torso(l, cx, n + 8 * s, s, 900);
    l.restore();
    head(l, cx, top, s, .05);
  });
}
</script>
